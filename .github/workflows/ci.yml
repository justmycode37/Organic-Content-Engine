name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run build
      - run: npm run server:build
      - run: npm run typecheck:server
      - run: npm test
  verify-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chatgpt-site/package-lock.json
      - run: npm --prefix chatgpt-site ci
      - run: npm --prefix chatgpt-site run check
        env:
          CHROME_PATH: /usr/bin/google-chrome
