[project]
name = "newsroom-studio"
version = "0.1.0"
description = "Deterministic HTML-to-MP4 Instagram Reel renderer for the Frontier Feed channel."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.48",
    "edge-tts>=7.0",
    "pillow>=10.4",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.uv]
package = true
