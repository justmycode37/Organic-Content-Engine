<!-- studio:meta
{
  "description": "2-4 items that reveal one by one. Items appear when the narration first mentions them (or at item_times), otherwise evenly spaced.",
  "media": "none",
  "props": {
    "items": {"type": "array", "items": {"type": "string", "max": 60}, "required": true, "min": 2, "max": 4, "description": "short lines, 2-7 words each"},
    "title": {"type": "string", "max": 60, "description": "optional heading above the list"},
    "kicker": {"type": "string", "max": 32, "description": "small label above the title"},
    "item_times": {"type": "array", "items": "number", "description": "optional reveal time (seconds into the scene) per item"},
    "numbered": {"type": "boolean", "default": true, "description": "show 01/02/03 numbers"}
  }
}
-->
<style>
  .tpl-list .content { justify-content: center; }
  .tpl-list .title { font-size: 84px; font-weight: 800; margin: 26px 0 34px; width: 100%; }
  .tpl-list ol { list-style: none; border-top: 2px solid var(--line); }
  .tpl-list li { display: flex; align-items: baseline; gap: 30px; padding: 34px 0; border-bottom: 2px solid var(--line); transition: none; }
  .tpl-list .n { font-family: var(--font-mono); font-weight: 700; font-size: 38px; color: var(--fg-3); flex: none; width: 66px; }
  .tpl-list .txt { font-size: 58px; font-weight: 700; line-height: 1.08; letter-spacing: -0.02em; color: var(--fg-2); }
  .tpl-list li.active .n { color: var(--accent); }
  .tpl-list li.active .txt { color: var(--fg); }
</style>
<div class="content">
  {% if p.kicker %}<div class="a-slide"><span class="kicker">{{ p.kicker }}</span></div>{% endif %}
  {% if p.title %}<div class="title display a-rise" style="animation-delay:.04s" data-fit="84,52" data-fit-h="200"><div>{{ p.title }}</div></div>{% endif %}
  <ol id="list">
    {% for item in p["items"] %}
    <li class="a-rise" data-text="{{ item }}"><span class="n">{% if p.numbered %}{{ "%02d" % loop.index }}{% else %}&mdash;{% endif %}</span><span class="txt">{{ item }}</span></li>
    {% endfor %}
  </ol>
</div>
<script>
(() => {
  const items = Array.from(document.querySelectorAll("#list li"));
  const given = {{ (p.item_times or []) | tojson }};
  const n = items.length;
  const first = {{ 0.45 if p.title else 0.2 }};
  const span = Math.max(0.4, studio.duration * 0.72 - first);
  const times = [];
  items.forEach((li, i) => {
    const even = first + (n > 1 ? (i * span) / (n - 1) : 0);
    const prev = i ? times[i - 1] + 0.25 : 0;
    let t = typeof given[i] === "number" ? given[i] : studio.cue(li.dataset.text, even, prev);
    t = Math.max(t, prev, i === 0 ? 0.1 : 0);
    times.push(t);
    li.style.animationDelay = t.toFixed(3) + "s";
  });
  studio.onFrame((t) => {
    let active = -1;
    times.forEach((s, i) => { if (t >= s) active = i; });
    items.forEach((li, i) => li.classList.toggle("active", i === active));
  });
})();
</script>
